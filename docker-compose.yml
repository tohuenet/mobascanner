# moba-scanner — single-service compose for the all-batteries image.
#
# Quick start:
#   docker compose up --build           # production-style run
#   docker compose --profile demo up    # also starts a Juice Shop sandbox to scan
#
# Then open http://localhost:3000.
#
# To scan a service running on YOUR HOST, target host.docker.internal:<port>
# (the extra_hosts mapping below makes that work on Linux too).
#
# Snyk needs auth once:
#   docker compose exec moba-scanner snyk auth

services:
  moba-scanner:
    build: .
    image: moba-scanner:latest
    ports:
      # Bump the *host* side if 3000 is already taken (e.g. MOBA_HOST_PORT=3030).
      # The app inside the container always listens on 3000.
      - "${MOBA_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    # Persist scan history (lib/store.ts writes JSON files under /app/data).
    volumes:
      - ./data:/app/data
    # Lets the container reach services bound to your host's loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Reports "ready" only when the Next server actually serves /api/tools.
    # `docker compose up --wait` blocks until this passes — useful for CI /
    # smoke-test scripts.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:3000/api/tools"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    # ── Tips (uncomment if you need them) ────────────────────────────────────
    # network_mode: host
    #   Linux only — drops Docker's NAT so 127.0.0.1 inside the container IS
    #   the host. Easiest way to scan many host-local services at once. Trades
    #   the published-port mapping above; reach the UI via http://localhost:3000.

    # cap_add:
    #   - NET_RAW
    #   - NET_ADMIN
    #   Needed for masscan / naabu raw-socket modes.

  # ── Optional sandbox: OWASP Juice Shop ─────────────────────────────────────
  # Self-contained, intentionally vulnerable target. Off by default; start it
  # with `docker compose --profile demo up`. From moba-scanner, target
  # http://juice-shop:3000/ (the "OWASP Juice Shop (local)" chip on /scan/web
  # pre-fills this).
  juice-shop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    profiles: ["demo"]
    # Uncomment if you want to browse the sandbox yourself:
    # ports:
    #   - "3100:3000"

  # ── Optional sidecar: OWASP ZAP daemon ──────────────────────────────────────
  # Uncomment + run `docker compose up zap`. In the moba UI, pick the ZAP
  # scanner and set options.zapBase = http://zap:8090
  # zap:
  #   image: zaproxy/zap-stable:latest
  #   command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
  #   ports:
  #     - "8090:8090"
  #   restart: unless-stopped
